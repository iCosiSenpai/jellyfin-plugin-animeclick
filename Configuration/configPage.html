<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>AnimeClick</title></head>
<body>
<div id="AnimeClickConfigPage" data-role="page" class="page type-interior pluginConfigurationPage ac-page"
     data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <div data-role="content"><div class="content-primary">
        <div id="acRoot" class="ac-app" lang="it">
            <div class="ac-loadstate" role="status">Caricamento di AnimeClick…</div>
        </div>
    </div></div>
    <script>
    (function () {
        var V = '1.5.0.0';
        var SCRIPTS = ['AnimeClickCoreJs', 'AnimeClickSettingsJs', 'AnimeClickLibraryJs', 'AnimeClickHomeJs', 'AnimeClickSetupJs', 'AnimeClickAppJs'];
        var pg = document.getElementById('AnimeClickConfigPage');
        function asset(name) { return 'configurationpage?name=' + name + '&v=' + V; }
        function failed() {
            var root = pg.querySelector('#acRoot');
            var state = document.createElement('div');
            state.className = 'ac-loadstate is-bad';
            state.setAttribute('role', 'alert');
            state.textContent = 'Non riesco a caricare la pagina di AnimeClick. Ricarica Jellyfin per riprovare.';
            while (root.firstChild) root.removeChild(root.firstChild);
            root.removeAttribute('data-ac-built');
            root.appendChild(state);
        }
        function ensureCss() {
            var id = 'ac-css-' + V;
            if (document.getElementById(id)) return;
            var link = document.createElement('link');
            link.id = id; link.rel = 'stylesheet'; link.href = asset('AnimeClickCss');
            link.addEventListener('error', function () { link.remove(); failed(); });
            document.head.appendChild(link);
        }
        function ensureScript(name, done) {
            var id = 'ac-js-' + name + '-' + V;
            var existing = document.getElementById(id);
            if (existing) {
                if (existing.dataset.loaded) done();
                else existing.addEventListener('load', done, { once: true });
                return;
            }
            var script = document.createElement('script');
            script.id = id; script.src = asset(name); script.async = false;
            script.addEventListener('load', function () { script.dataset.loaded = '1'; done(); });
            script.addEventListener('error', function () { script.remove(); failed(); });
            document.head.appendChild(script);
        }
        function ensureAll(index, done) {
            if (index >= SCRIPTS.length) { done(); return; }
            ensureScript(SCRIPTS[index], function () { ensureAll(index + 1, done); });
        }
        pg.addEventListener('pageshow', function () {
            ensureCss();
            ensureAll(0, function () { window.AnimeClickUI.app.show(pg); });
        });
        pg.addEventListener('pagehide', function () {
            if (window.AnimeClickUI && window.AnimeClickUI.app) window.AnimeClickUI.app.pageHidden();
        });
    })();
    </script>
</div>
</body>
</html>
