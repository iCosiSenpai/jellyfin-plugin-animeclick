<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <title>AnimeClick Metadata</title>
</head>
<body>
    <div id="AnimeClickConfigPage" data-role="page" class="page type-interior pluginConfigurationPage ac-page"
         data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div class="ac-shell" id="acConfigShell">

                    <!-- hero -->
                    <div class="ac-hero ac-reveal">
                        <div class="ac-hero-scrim"></div>
                        <div class="ac-hero-content">
                            <div class="ac-row" style="justify-content:space-between;">
                                <div class="ac-brand">
                                    <div class="ac-comet" aria-hidden="true"></div>
                                    <div class="ac-wordmark"><strong>Anime</strong><span>Click</span></div>
                                </div>
                                <span class="ac-row" style="gap:8px;"><span class="ac-live-dot is-idle" id="acLiveDot"></span><span class="ac-version" id="acVersion">v0.3.2.0</span></span>
                            </div>
                            <div class="ac-stats">
                                <div class="ac-stat" id="acStatProviders"><span class="ac-stat-label">Provider</span><span class="ac-stat-value">…</span><span class="ac-stat-sub"></span></div>
                                <div class="ac-stat" id="acStatCache"><span class="ac-stat-label">Cache</span><span class="ac-stat-value">…</span><span class="ac-stat-sub"></span></div>
                                <div class="ac-stat" id="acStatFeatures"><span class="ac-stat-label">Funzionalità</span><span class="ac-stat-value">…</span><span class="ac-stat-sub"></span></div>
                            </div>
                        </div>
                    </div>

                    <!-- tabs -->
                    <nav class="ac-tabs ac-reveal" id="acTabs" role="tablist">
                        <button type="button" class="ac-tab" role="tab" data-panel="overview" aria-selected="true">Overview</button>
                        <button type="button" class="ac-tab" role="tab" data-panel="metadati" aria-selected="false">Metadati</button>
                        <button type="button" class="ac-tab" role="tab" data-panel="sinossi" aria-selected="false">Sinossi</button>
                        <button type="button" class="ac-tab" role="tab" data-panel="strumenti" aria-selected="false">Strumenti</button>
                    </nav>

                    <!-- panels (populated by JS) -->
                    <div class="ac-panel active" data-panel="overview" id="acPanelOverview"></div>
                    <div class="ac-panel" data-panel="metadati" id="acPanelMetadati"></div>
                    <div class="ac-panel" data-panel="sinossi" id="acPanelSinossi"></div>
                    <div class="ac-panel" data-panel="strumenti" id="acPanelStrumenti"></div>

                    <!-- sticky save bar -->
                    <div class="ac-stickybar" id="acSaveBar" style="display:none;">
                        <span class="ac-state">Modifiche non salvate</span>
                        <button type="button" class="ac-btn ac-btn-ghost" id="acBtnDiscard">Annulla</button>
                        <button type="button" class="ac-btn ac-btn-primary" id="acBtnSave">💾 Salva</button>
                    </div>

                    <!-- support -->
                    <div class="ac-support">
                        <span class="ac-support-label">AnimeClick ti è utile? Supporta lo sviluppo ❤️</span>
                        <a class="ac-support-btn" href="https://buymeacoffee.com/iCosiSenpai" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffee"><img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy me a coffee" height="40" /></a>
                        <a class="ac-support-btn" href="https://www.paypal.com/donate/?hosted_button_id=5A4E26XC45GLQ" target="_blank" rel="noopener noreferrer" aria-label="Donate with PayPal"><img src="https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif" alt="Donate with PayPal" height="40" /></a>
                    </div>

                </div>
            </div>
        </div>
        <script>
        (function () {
            var V = '0.3.2.0';
            function asset(name) { return 'configurationpage?name=' + name + '&v=' + V; }
            function ensureCss() {
                var id = 'ac-css-' + V;
                if (document.getElementById(id)) { return; }
                var link = document.createElement('link');
                link.id = id; link.rel = 'stylesheet'; link.href = asset('AnimeClickCss');
                document.head.appendChild(link);
            }
            function ensureJs(name, done) {
                var id = 'ac-js-' + name + '-' + V;
                var existing = document.getElementById(id);
                if (existing) {
                    if (existing.dataset.loaded) { done(); }
                    else { existing.addEventListener('load', done); }
                    return;
                }
                var script = document.createElement('script');
                script.id = id; script.src = asset(name);
                script.addEventListener('load', function () { script.dataset.loaded = '1'; done(); });
                document.head.appendChild(script);
            }
            var pg = document.getElementById('AnimeClickConfigPage');
            pg.addEventListener('pageshow', function () {
                ensureCss();
                ensureJs('AnimeClickConfigJs', function () {
                    window.AC.config.show(pg);
                });
            });
        })();
        </script>
    </div>
</body>
</html>
