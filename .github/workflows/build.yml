name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj
      - name: Verify hardcoded versions match the project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          echo "Project version: ${PROJECT_VERSION}"
          # The version is repeated by hand in the config page (cache-busting query strings and
          # the displayed version), in the config page's JavaScript and in the default
          # User-Agent. Forgetting one at release time is silent: the browser keeps serving the
          # previous CSS/JS against a new backend. These files must contain no four-part version
          # literal other than the current one.
          status=0
          for file in Configuration/configPage.html Web/assets/animeclick-config.js PluginConfiguration.cs; do
            while IFS=: read -r line found; do
              if [[ "${found}" != "${PROJECT_VERSION}" ]]; then
                echo "::error file=${file},line=${line}::version ${found} does not match project version ${PROJECT_VERSION}"
                status=1
              fi
            done < <(grep -noE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "${file}" || true)
          done
          exit "${status}"
      - name: Build
        run: dotnet build AnimeClick.Plugin.csproj -c Release --no-restore
      - name: Test
        run: dotnet test AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj -c Release --no-restore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CHECKSUM: ''
      SOURCE_URL: ''
      VERSION: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH.REVISION; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag ${TAG_VERSION} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Publish
        run: dotnet publish AnimeClick.Plugin.csproj -c Release -o publish

      - name: Package and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f AnimeClick.Plugin.zip
          zip -j AnimeClick.Plugin.zip publish/AnimeClick.Plugin.dll publish/HtmlAgilityPack.dll
          CHECKSUM_VALUE="$(md5sum AnimeClick.Plugin.zip | cut -d ' ' -f 1 | tr 'a-f' 'A-F')"
          SOURCE_VALUE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AnimeClick.Plugin.zip"
          [[ -n "${CHECKSUM_VALUE}" ]]
          [[ "${SOURCE_VALUE}" == https://github.com/*/releases/download/v*/AnimeClick.Plugin.zip ]]
          echo "CHECKSUM=${CHECKSUM_VALUE}" >> "${GITHUB_ENV}"
          echo "SOURCE_URL=${SOURCE_VALUE}" >> "${GITHUB_ENV}"

      # A tag creates only a draft. The maintainer must update and validate the
      # external Jellyfin manifest with this exact version/checksum/sourceUrl,
      # complete the release-asset smoke test, then explicitly publish the draft.
      - name: Create gated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AnimeClick Metadata ${{ github.ref_name }}
          files: AnimeClick.Plugin.zip
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          body: |
            ## AnimeClick Metadata Plugin ${{ github.ref_name }}

            Rilascio di correzioni. Tre difetti sono stati trovati mettendo il plugin alla prova
            su una libreria reale, non leggendo il codice, e due di essi impedivano da sempre a
            intere funzioni di produrre qualcosa.

            **Le sinossi italiane da TheTVDB non hanno mai funzionato**
            TheTVDB risponde con l'elenco degli episodi annidato dentro un oggetto, mentre il
            plugin si aspettava un elenco al primo livello: ogni pagina veniva quindi scartata
            come non valida e l'anello TheTVDB della catena sinossi non ha mai restituito niente,
            in silenzio. Su otto serie di prova TheTVDB aveva 119 sinossi italiane su 212
            episodi, tutte irraggiungibili. Essendo il primo anello dopo AnimeClick, la
            correzione riduce anche il ricorso alla traduzione automatica.

            **Le sinossi di AnimeClick mancavano su tutti gli episodi con un accento nel titolo**
            L'identificativo salvato per quegli episodi contiene la codifica percentuale
            (`c%C3%A8-una-ragione`), e il plugin la rifiutava, cioè rifiutava un dato che aveva
            scritto lui stesso: la sinossi AnimeClick non veniva mai richiesta. Su una libreria di
            prova erano 224 identificativi su 1781, il 13%.

            **Una stagione intera poteva ricevere i titoli sfalsati di una posizione**
            Quando la tabella di AnimeClick contiene più righe degli episodi che AnimeClick stessa
            dichiara, i suoi numeri e le sue posizioni non corrispondono più alla libreria e ogni
            titolo finiva sull'episodio precedente, con piena confidenza. Ora quella discordanza
            viene rilevata e il titolo del file deve confermare la corrispondenza: in mancanza
            l'episodio resta intatto, perché nessun metadato è preferibile a un metadato
            plausibile e sbagliato.

            **Altre correzioni**
            - I titoli che ripetono soltanto il numero (`Episodio 11.`, `Ep.11`, `Episodio 11-12`,
              `Puntata 5`) non vengono più scritti: la regola è ora una sola per titoli e sinossi.
            - La coda delle traduzioni non può più fermarsi in silenzio: un guasto viene registrato
              e il lavoratore riparte, invece di lasciare le traduzioni bloccate fino al riavvio.
            - Passo minimo e rispetto delle richieste di rallentamento verso TheTVDB, TMDB e
              AniList, che prima venivano interrogati senza freni durante una scansione.

            La catena sinossi episodi resta AnimeClick → TheTVDB ita → TMDB it-IT →
            TMDB en-US → TheTVDB eng → Ollama Cloud EN→IT. La modalità solo AnimeClick
            non richiede API key.

            **Compatibilità:** Jellyfin 10.11.x (ABI 10.11.8.0)
            **Versione:** `${{ env.VERSION }}`
            **Checksum MD5:** `${{ env.CHECKSUM }}`
            **Source URL manifest:** `${{ env.SOURCE_URL }}`

            > **Release gate:** questa release resta draft finché `manifest.json` non è
            > aggiornato e verificato con gli esatti versione, checksum e source URL sopra,
            > e l'asset non supera lo smoke test. Solo allora va pubblicata come latest.
