name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj
      - name: Verify hardcoded versions match the project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          echo "Project version: ${PROJECT_VERSION}"
          # The version is repeated by hand in the config page (cache-busting query strings and
          # the displayed version), in the config page's JavaScript and in the default
          # User-Agent. Forgetting one at release time is silent: the browser keeps serving the
          # previous CSS/JS against a new backend. These files must contain no four-part version
          # literal other than the current one.
          status=0
          for file in Configuration/configPage.html Web/assets/animeclick-config.js PluginConfiguration.cs; do
            while IFS=: read -r line found; do
              if [[ "${found}" != "${PROJECT_VERSION}" ]]; then
                echo "::error file=${file},line=${line}::version ${found} does not match project version ${PROJECT_VERSION}"
                status=1
              fi
            done < <(grep -noE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "${file}" || true)
          done
          exit "${status}"
      - name: Build
        run: dotnet build AnimeClick.Plugin.csproj -c Release --no-restore
      - name: Test
        run: dotnet test AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj -c Release --no-restore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CHECKSUM: ''
      SOURCE_URL: ''
      VERSION: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH.REVISION; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag ${TAG_VERSION} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Publish
        run: dotnet publish AnimeClick.Plugin.csproj -c Release -o publish

      - name: Package and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f AnimeClick.Plugin.zip
          # LICENSE e NOTICE viaggiano con il programma: la GPL richiede che la licenza
          # accompagni la distribuzione, e il NOTICE dichiara i termini aggiuntivi
          # ammessi dalla sezione 7(e) su nome e logo. Jellyfin carica le DLL e ignora
          # il resto, quindi due file di testo in piu' non cambiano l'installazione.
          zip -j AnimeClick.Plugin.zip publish/AnimeClick.Plugin.dll publish/HtmlAgilityPack.dll LICENSE NOTICE
          CHECKSUM_VALUE="$(md5sum AnimeClick.Plugin.zip | cut -d ' ' -f 1 | tr 'a-f' 'A-F')"
          SOURCE_VALUE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AnimeClick.Plugin.zip"
          [[ -n "${CHECKSUM_VALUE}" ]]
          [[ "${SOURCE_VALUE}" == https://github.com/*/releases/download/v*/AnimeClick.Plugin.zip ]]
          echo "CHECKSUM=${CHECKSUM_VALUE}" >> "${GITHUB_ENV}"
          echo "SOURCE_URL=${SOURCE_VALUE}" >> "${GITHUB_ENV}"

      # A tag creates only a draft. The maintainer downloads that authenticated
      # asset, records its exact checksum, publishes the draft, smoke-tests the now
      # public sourceUrl, and only then commits and pushes the Jellyfin manifest.
      - name: Create gated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AnimeClick Metadata ${{ github.ref_name }}
          files: AnimeClick.Plugin.zip
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          body: |
            ## AnimeClick Metadata Plugin ${{ github.ref_name }}

            La ricerca su AnimeClick non funzionava più. Adesso sì.

            **Il guasto**
            - AnimeClick è passato da Bootstrap 3 a Bootstrap 5. Il parser cercava
              `h4.media-heading`; nel markup nuovo l'intestazione dei risultati è un `<h4>` senza
              nessuna classe. Il contenitore esterno reggeva ancora, quindi il parser trovava i
              risultati della pagina e li scartava uno per uno: nei log si leggeva
              «Parsed 0 search candidates», mai un errore. Trentasette ricerche su trentasette in
              tre giorni, zero risultati, in silenzio.
            - Chi aveva già l'identificativo salvato continuava ad aggiornarsi. Ogni titolo aggiunto
              dopo il cambio del sito non poteva più essere riconosciuto.
            - Nella stessa migrazione se ne sono andati `div.well` (ora `card`) e le intestazioni
              `media-heading` (ora `mo-heading`): staff e opere collegate tornavano vuoti.

            **Perché i test non se ne erano accorti**
            - Le fixture erano HTML scritto a mano, fermo al layout di prima: descrivevano un sito
              che non esiste più. Ora sono pagine scaricate da animeclick.it, e dieci prove le
              interrogano. Il prossimo cambio di markup fa diventare rossi i test invece di
              lasciare il guasto ai log.

            **La ricerca trova di più**
            - Taglia i residui delle release: una cartella chiamata
              `Paprika.2006.4K.HDR.DV.2160p.BDRip Ita Eng Jap x265-NAHOM` diventa il titolo
              dell'elemento, e nessuna query poteva funzionare.
            - Accorcia il titolo dalla coda una parola alla volta, perché il sito cerca sottostringhe
              contigue e conosce l'opera con un altro nome: «Saekano the Movie Finale» non esiste,
              «Saekano» trova la scheda.
            - In ultima istanza prova le parole che da sole identificano l'opera, per i casi in cui
              quella che conta sta in mezzo e nessun prefisso la raggiunge.

            **E sbaglia di meno**
            - Query più larghe sbagliano bersaglio, e il primo risultato veniva preso senza guardare
              il punteggio: cercando «Finale», il film finale di Saekano si prendeva la sinossi di
              Gintama. Ora sul nome dell'opera ci si fida come prima, su un prefisso serve la soglia
              o l'assenza di alternative, su una parola sola servono la soglia e l'anno esatto.
            - Uno scarto di anni pesa di più, perché fra due stagioni il titolo non distingue: la
              terza di Mushoku Tensei ereditava la sinossi della prima.

            **Sinossi italiana anche quando AnimeClick non ce l'ha**
            - Se la scheda esiste ma la trama è vuota, film e serie non ricevevano nulla, mentre per
              gli episodi la catena di ripiego esisteva già. Ora la sinossi arriva da TMDB, scritta
              solo su campo vuoto e solo se il testo è davvero in italiano.

            **Compatibilità:** Jellyfin 10.11.x (ABI 10.11.8.0)
            **Versione:** `${{ env.VERSION }}`
            **Checksum MD5:** `${{ env.CHECKSUM }}`
            **Source URL manifest:** `${{ env.SOURCE_URL }}`

            > **Procedura di pubblicazione:** questa release nasce come draft. Scaricare l'asset
            > con `gh`, calcolarne l'MD5, pubblicare la draft, verificare l'URL pubblico e lo
            > stesso MD5, quindi aggiungere e pushare la voce in `manifest.json` nello stesso
            > giro. Il manifest non deve mai puntare a una draft, perché l'asset risponde 404.
