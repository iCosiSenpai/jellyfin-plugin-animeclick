name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.0.0', '12.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify embedded versions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          status=0
          for file in Configuration/configPage.html Web/assets/*.js PluginConfiguration.cs; do
            while IFS=: read -r line found; do
              if [[ "${found}" != "${PROJECT_VERSION}" ]]; then
                echo "::error file=${file},line=${line}::version ${found} does not match ${PROJECT_VERSION}"
                status=1
              fi
            done < <(grep -noE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "${file}" || true)
          done
          exit "${status}"
      - name: Build and test server compatibility
        run: dotnet test AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj -c Release -p:JellyfinVersion=${{ matrix.jellyfin }} -warnaserror
      - name: Validate reviewed community mappings
        run: |
          python3 tools/community_mappings.py
          python3 -m unittest discover -s tools/tests
      - name: Build diagnostic harness
        run: dotnet build tools/AnimeClick.Harness/AnimeClick.Harness.csproj -c Release -p:JellyfinVersion=${{ matrix.jellyfin }} -warnaserror

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/AnimeClick.WebTests/package-lock.json
      - run: npm ci
        working-directory: tools/AnimeClick.WebTests
      - run: npx playwright install --with-deps chromium
        working-directory: tools/AnimeClick.WebTests
      - run: npm test
        working-directory: tools/AnimeClick.WebTests
      - run: npm audit --audit-level=high
        working-directory: tools/AnimeClick.WebTests

  release:
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${TAG_VERSION}" == "${PROJECT_VERSION}" ]]
          test -s "docs/releases/${TAG_VERSION}.md"
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"
      - name: Publish against the minimum supported ABI
        run: dotnet publish AnimeClick.Plugin.csproj -c Release -p:JellyfinVersion=12.0.0 -o publish -warnaserror
      - name: Package distributable dependencies only
        shell: bash
        run: |
          set -euo pipefail
          zip -j AnimeClick.Plugin.zip publish/AnimeClick.Plugin.dll publish/HtmlAgilityPack.dll LICENSE NOTICE
          unzip -t AnimeClick.Plugin.zip
          md5sum AnimeClick.Plugin.zip
          sha256sum AnimeClick.Plugin.zip
      # Verify the draft asset, publish, then verify its PUBLIC URL before updating
      # the catalog. Never point a catalog entry at a draft. See docs/RELEASING.md.
      - name: Create gated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AnimeClick Metadata ${{ github.ref_name }}
          files: AnimeClick.Plugin.zip
          body_path: docs/releases/${{ env.VERSION }}.md
          draft: true
          prerelease: false
          make_latest: false
