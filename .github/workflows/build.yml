name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj
      - name: Verify hardcoded versions match the project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          echo "Project version: ${PROJECT_VERSION}"
          # The version is repeated by hand in the config page (cache-busting query strings and
          # the displayed version), in the config page's JavaScript and in the default
          # User-Agent. Forgetting one at release time is silent: the browser keeps serving the
          # previous CSS/JS against a new backend. These files must contain no four-part version
          # literal other than the current one.
          status=0
          for file in Configuration/configPage.html Web/assets/animeclick-config.js PluginConfiguration.cs; do
            while IFS=: read -r line found; do
              if [[ "${found}" != "${PROJECT_VERSION}" ]]; then
                echo "::error file=${file},line=${line}::version ${found} does not match project version ${PROJECT_VERSION}"
                status=1
              fi
            done < <(grep -noE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "${file}" || true)
          done
          exit "${status}"
      - name: Build
        run: dotnet build AnimeClick.Plugin.csproj -c Release --no-restore
      - name: Test
        run: dotnet test AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj -c Release --no-restore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CHECKSUM: ''
      SOURCE_URL: ''
      VERSION: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH.REVISION; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag ${TAG_VERSION} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Publish
        run: dotnet publish AnimeClick.Plugin.csproj -c Release -o publish

      - name: Package and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f AnimeClick.Plugin.zip
          zip -j AnimeClick.Plugin.zip publish/AnimeClick.Plugin.dll publish/HtmlAgilityPack.dll
          CHECKSUM_VALUE="$(md5sum AnimeClick.Plugin.zip | cut -d ' ' -f 1 | tr 'a-f' 'A-F')"
          SOURCE_VALUE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AnimeClick.Plugin.zip"
          [[ -n "${CHECKSUM_VALUE}" ]]
          [[ "${SOURCE_VALUE}" == https://github.com/*/releases/download/v*/AnimeClick.Plugin.zip ]]
          echo "CHECKSUM=${CHECKSUM_VALUE}" >> "${GITHUB_ENV}"
          echo "SOURCE_URL=${SOURCE_VALUE}" >> "${GITHUB_ENV}"

      # A tag creates only a draft. The maintainer must update and validate the
      # external Jellyfin manifest with this exact version/checksum/sourceUrl,
      # complete the release-asset smoke test, then explicitly publish the draft.
      - name: Create gated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AnimeClick Metadata ${{ github.ref_name }}
          files: AnimeClick.Plugin.zip
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          body: |
            ## AnimeClick Metadata Plugin ${{ github.ref_name }}

            Rilascio di correttezza, sicurezza e robustezza: tre giri di audit del codice
            sopra la 0.4.3, senza nuove funzionalità e senza cambi di configurazione
            richiesti all'utente.

            **Correttezza dei metadati**
            - **Righe "Speciale" non diventano più episodi con numero l'anno.** L'etichetta
              italiana `Speciale ...` non veniva riconosciuta come speciale e il primo numero
              trovato nell'etichetta veniva preso come numero di episodio: una riga
              "Speciale natalizio 2015" diventava l'episodio 2015. Su una pagina con etichette
              miste questo spostava di una posizione tutti gli episodi successivi; su una pagina
              piatta rompeva la suddivisione automatica delle stagioni. Riconosciute anche
              `Riepilogo` e `Sigla`.
            - Il filtro sulle locandine a bassa risoluzione non si disattiva più da solo: il
              rilevamento delle dimensioni non memorizza più i propri fallimenti per una
              settimana, e legge un prefisso abbastanza grande da funzionare anche sui JPEG con
              dati EXIF o profilo colore.

            **Sicurezza**
            - Gli URL immagine di serie, film, episodi e stagioni passano ora dalla stessa
              allow-list host su HTTPS già usata da locandine e foto del cast: quattro percorsi
              su sei scaricavano qualunque indirizzo. Stesso controllo sulle anteprime dei
              risultati di ricerca.
            - Un header `Retry-After` senza limiti non può più bloccare lo scraping fino al
              riavvio di Jellyfin: la pausa richiesta dal server è rispettata ma limitata a 15
              minuti.
            - Le impostazioni sono validate sul server e non solo nella pagina di
              configurazione: URL di base non valido, ritardi negativi o valori fuori scala
              vengono corretti invece di essere salvati.

            **Robustezza e diagnosi**
            - Timeout espliciti e tetto sulla dimensione delle risposte su tutti i client di
              rete; budget complessivo sul recupero della lista episodi di TheTVDB.
            - Un token TheTVDB scaduto o revocato viene ora scartato invece di essere
              riutilizzato per 24 ore lasciando ogni sinossi vuota.
            - **I fallimenti veri sono visibili nel log**: chiave API sbagliata, quota esaurita,
              401 e cambi di struttura del sito erano registrati a livello Debug, quindi con la
              configurazione di default apparivano all'utente solo come "nessun metadato".
            - Un errore di scrittura della cache (disco pieno, permessi) non fa più perdere
              tutti i metadati dell'elemento in lavorazione.
            - Le foto degli autori sono ora in cache: era il percorso di scraping più pesante,
              ripetuto per ogni doppiatore a ogni scansione.

            La catena sinossi episodi resta AnimeClick → TheTVDB ita → TMDB it-IT →
            TMDB en-US → TheTVDB eng → Ollama Cloud EN→IT. La modalità solo AnimeClick
            non richiede API key.

            **Compatibilità:** Jellyfin 10.11.x (ABI 10.11.8.0)
            **Versione:** `${{ env.VERSION }}`
            **Checksum MD5:** `${{ env.CHECKSUM }}`
            **Source URL manifest:** `${{ env.SOURCE_URL }}`

            > **Release gate:** questa release resta draft finché `manifest.json` non è
            > aggiornato e verificato con gli esatti versione, checksum e source URL sopra,
            > e l'asset non supera lo smoke test. Solo allora va pubblicata come latest.
