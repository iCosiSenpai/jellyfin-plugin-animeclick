name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj
      - name: Verify hardcoded versions match the project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          echo "Project version: ${PROJECT_VERSION}"
          # The version is repeated by hand in the config page (cache-busting query strings and
          # the displayed version), in the config page's JavaScript and in the default
          # User-Agent. Forgetting one at release time is silent: the browser keeps serving the
          # previous CSS/JS against a new backend. These files must contain no four-part version
          # literal other than the current one.
          status=0
          for file in Configuration/configPage.html Web/assets/animeclick-config.js PluginConfiguration.cs; do
            while IFS=: read -r line found; do
              if [[ "${found}" != "${PROJECT_VERSION}" ]]; then
                echo "::error file=${file},line=${line}::version ${found} does not match project version ${PROJECT_VERSION}"
                status=1
              fi
            done < <(grep -noE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "${file}" || true)
          done
          exit "${status}"
      - name: Build
        run: dotnet build AnimeClick.Plugin.csproj -c Release --no-restore
      - name: Test
        run: dotnet test AnimeClick.Plugin.Tests/AnimeClick.Plugin.Tests.csproj -c Release --no-restore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CHECKSUM: ''
      SOURCE_URL: ''
      VERSION: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(dotnet msbuild AnimeClick.Plugin.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH.REVISION; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag ${TAG_VERSION} does not match project version ${PROJECT_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Publish
        run: dotnet publish AnimeClick.Plugin.csproj -c Release -o publish

      - name: Package and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f AnimeClick.Plugin.zip
          zip -j AnimeClick.Plugin.zip publish/AnimeClick.Plugin.dll publish/HtmlAgilityPack.dll
          CHECKSUM_VALUE="$(md5sum AnimeClick.Plugin.zip | cut -d ' ' -f 1 | tr 'a-f' 'A-F')"
          SOURCE_VALUE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AnimeClick.Plugin.zip"
          [[ -n "${CHECKSUM_VALUE}" ]]
          [[ "${SOURCE_VALUE}" == https://github.com/*/releases/download/v*/AnimeClick.Plugin.zip ]]
          echo "CHECKSUM=${CHECKSUM_VALUE}" >> "${GITHUB_ENV}"
          echo "SOURCE_URL=${SOURCE_VALUE}" >> "${GITHUB_ENV}"

      # A tag creates only a draft. The maintainer must update and validate the
      # external Jellyfin manifest with this exact version/checksum/sourceUrl,
      # complete the release-asset smoke test, then explicitly publish the draft.
      - name: Create gated draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AnimeClick Metadata ${{ github.ref_name }}
          files: AnimeClick.Plugin.zip
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          body: |
            ## AnimeClick Metadata Plugin ${{ github.ref_name }}

            Rilascio di funzionalità. La traduzione automatica non è più legata a un solo
            fornitore, la pagina di configurazione dice per la prima volta *perché* una stagione
            resta senza titoli, e sono state chiuse alcune falle di abbinamento trovate provando
            il plugin su una libreria reale.

            **La traduzione ora funziona con il servizio AI che preferisci**
            Prima esisteva soltanto Ollama Cloud. Ora il servizio si sceglie da un menu: Ollama
            (in rete o in casa), OpenAI, Anthropic Claude, Google Gemini, Mistral, Groq, DeepSeek,
            OpenRouter, Together, xAI Grok, LM Studio, oppure qualunque endpoint compatibile
            OpenAI — LiteLLM, vLLM, llama.cpp, un proxy aziendale. Bastano tre formati di
            richiesta per coprirli tutti, e chi incolla un endpoint sotto «Personalizzato» viene
            riconosciuto dal percorso dell'URL.

            Il nome del modello non ha più un valore predefinito, ed è voluto: i fornitori
            ritirano e rinominano i modelli continuamente, e un default scaduto diventa «la
            traduzione ha smesso di funzionare senza dire niente». Il pulsante **Elenca modelli**
            chiede la lista al servizio con la tua chiave.

            Chi aveva già configurato Ollama non deve fare niente: il profilo salvato viene
            travasato nei nuovi campi al primo avvio, chiave compresa.

            *Non* è possibile usare un abbonamento ChatGPT o Claude al posto di una chiave API:
            l'API di OpenAI è fatturata a parte e Anthropic vieta espressamente l'uso dei token
            dei piani Free, Pro e Max fuori dai suoi programmi. L'unico modo per non tenere una
            chiave dentro Jellyfin è un servizio in casa che custodisca lui le credenziali.

            **Una nuova scheda «Libreria» che spiega i titoli mancanti**
            Un titolo assente sembrava identico qualunque ne fosse la causa, e le cause chiedono
            reazioni opposte: una si risolve con un pulsante, una si sistemerà da sé, una è una
            lacuna della fonte che nessun aggiornamento colmerà. L'analisi legge solo le schede
            già in cache — nessuna richiesta ad AnimeClick — e per ogni serie e stagione dice
            quale delle nove cause è in gioco, con i colori a indicare quanto ci si può fare.
            Accanto, per ogni serie, i pulsanti per rileggerne la scheda, svuotarne la cache o
            identificarla.

            **Il ricontrollo settimanale dei titoli ora sceglie con criterio**
            Prendeva i primi duecento episodi senza titolo in ordine di libreria, spendendo il
            budget sulle schede che non pubblicano titoli affatto — settimana dopo settimana,
            senza possibilità di riuscita — e ignorava per sempre gli episodi mai abbinati,
            perché Jellyfin rinfresca un episodio solo se ne cambia il file. Ora è la stessa
            classificazione dell'analisi a scegliere e a ordinare la coda.

            **Abbinamenti recuperati**
            - Una tabella che elenca uno spin-off numerato insieme alla serie (K-On!! con i corti
              «Ura-On!!») azzerava le coordinate di tutte le righe per via dei numeri ripetuti, e
              rendeva inabbinabile una stagione interamente numerata. Le righe che portano
              l'etichetta di un'altra opera vengono ora archiviate tra gli speciali, ma soltanto
              se collidono davvero: un'etichetta insolita ma legittima non costa un titolo.
            - Gli extra numerati oltre la fine della serie regolare («Ep. 25 (extra)» dopo una
              corsa che finisce a 24) vengono abbinati ai file che la libreria tiene, del tutto
              ragionevolmente, come episodi 25 e 26.

            **Timeout della traduzione portato a 90 secondi**
            Il tetto di 30 secondi tagliava richieste sane: su una libreria reale la traduzione
            riuscita più lenta rientrava 120 millisecondi prima della scadenza, e ogni fallimento
            stava esattamente sul limite. È un tetto, non un'attesa: una risposta rapida non ci
            arriva vicino.

            **Compatibilità:** Jellyfin 10.11.x (ABI 10.11.8.0)
            **Versione:** `${{ env.VERSION }}`
            **Checksum MD5:** `${{ env.CHECKSUM }}`
            **Source URL manifest:** `${{ env.SOURCE_URL }}`

            > **Release gate:** questa release resta draft finché `manifest.json` non è
            > aggiornato e verificato con gli esatti versione, checksum e source URL sopra,
            > e l'asset non supera lo smoke test. Solo allora va pubblicata come latest.
