name: community relay

on:
  push:
    branches: [main]
    paths: ['community/relay/**', 'community/fixtures/**', '.github/workflows/community-relay.yml']
  pull_request:
    branches: [main]
    paths: ['community/relay/**', 'community/fixtures/**', '.github/workflows/community-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
      - run: npm test
        working-directory: community/relay

  # Optional: republish from CI when a Cloudflare token limited to Workers is stored in the repository.
  # The first publication, which creates the secrets, is done once with deploy.py --github-secret.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: community-relay-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Relay not republished from CI: no CLOUDFLARE_API_TOKEN secret (deploy.py can be run from the NAS)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          persist-credentials: false
      - name: Republish the worker, keeping its secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python3 community/relay/deploy.py
